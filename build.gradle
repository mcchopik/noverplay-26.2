plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        url "https://m2.dv8tion.net/releases"
    }
    maven { url "https://jitpack.io" }
    
    maven { 
        name = "lavalink"
        url = "https://maven.lavalink.dev/releases" 
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "noverplay" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation "dev.arbjerg:lavaplayer:2.2.6"
    include "dev.arbjerg:lavaplayer:2.2.6"
    implementation "dev.arbjerg:lava-common:2.2.6"
    include "dev.arbjerg:lava-common:2.2.6"
    implementation "dev.arbjerg:lavaplayer-natives:2.2.6"
    include "dev.arbjerg:lavaplayer-natives:2.2.6"
    
    implementation "dev.lavalink.youtube:common:1.17.0"
    include "dev.lavalink.youtube:common:1.17.0"
    implementation "dev.lavalink.youtube:v2:1.17.0"
    include "dev.lavalink.youtube:v2:1.17.0"
    implementation "org.mozilla:rhino-engine:1.7.15"
    include "org.mozilla:rhino-engine:1.7.15"
    implementation "org.mozilla:rhino:1.7.15"
    include "org.mozilla:rhino:1.7.15"
    implementation "com.grack:nanojson:1.7"
    include "com.grack:nanojson:1.7"

    implementation "org.slf4j:slf4j-simple:1.7.36"
    include "org.slf4j:slf4j-simple:1.7.36"
    implementation "org.slf4j:jcl-over-slf4j:1.7.36"
    include "org.slf4j:jcl-over-slf4j:1.7.36"
    implementation "org.apache.httpcomponents:httpclient:4.5.14"
    include "org.apache.httpcomponents:httpclient:4.5.14"
    implementation "org.apache.httpcomponents:httpcore:4.4.16"
    include "org.apache.httpcomponents:httpcore:4.4.16"
    implementation "commons-codec:commons-codec:1.15"
    include "commons-codec:commons-codec:1.15"
    implementation "commons-io:commons-io:2.11.0"
    include "commons-io:commons-io:2.11.0"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.14.2"
    include "com.fasterxml.jackson.core:jackson-databind:2.14.2"
    implementation "com.fasterxml.jackson.core:jackson-core:2.14.2"
    include "com.fasterxml.jackson.core:jackson-core:2.14.2"
    implementation "com.fasterxml.jackson.core:jackson-annotations:2.14.2"
    include "com.fasterxml.jackson.core:jackson-annotations:2.14.2"
    implementation "org.jsoup:jsoup:1.15.4"
    include "org.jsoup:jsoup:1.15.4"
}
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE 
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {}
}
